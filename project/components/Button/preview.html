<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body style="padding:16px">
<div id="root"></div>
<script>
  var M = window.Matrimonio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(function () { return h('div',{style:{display:'flex',flexDirection:'column',gap:18}},
  h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
    h(M.Button,null,'Confirmar'), h(M.Button,{variant:'secondary'},'Cómo llegar'), h(M.Button,{variant:'quiet'},'Descartar'), h(M.Button,{variant:'dark'},'Traer datos')),
  h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center'}},
    h(M.Button,{size:'xl'},'Confirmar asistencia'), h(M.Button,{size:'md',variant:'secondary',icon:'camera'},'Comprobante'), h(M.Button,{size:'sm'},'Asiste')),
  h('div',{style:{maxWidth:360}}, h(M.Button,{variant:'dashed',block:true},'+ Agregar acompañante (1 disponible)'))); }));
</script>
</body>
</html>
