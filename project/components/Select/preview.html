<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body style="padding:16px">
<div id="root"></div>
<script>
  var M = window.Matrimonio, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(function () { return h('div',{style:{display:'flex',flexDirection:'column',gap:16,maxWidth:360}},
  h(M.Select,{label:'Menú',options:['Sin preferencia','Vegetariano','Vegano','Menú infantil']}),
  h(M.Select,{label:'Menú',placeholder:'Elige una opción',hint:'Puedes cambiarlo hasta el 1 de agosto.',options:['Sin preferencia','Vegetariano','Vegano','Menú infantil']}),
  h(M.Select,{label:'Menú',required:true,placeholder:'Elige una opción',error:'Elige un menú.',options:['Sin preferencia','Vegetariano','Vegano','Menú infantil']}),
  h(M.Select,{label:'Menú',disabled:true,defaultValue:'Vegano',options:['Sin preferencia','Vegetariano','Vegano','Menú infantil']})); }));
</script>
</body>
</html>
